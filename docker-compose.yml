version: '3.8'

networks:
  app_network:
services:
  postgres:
    image: postgres:16
    container_name: postgres_container
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:

      - postgres_data:/var/lib/postgresql/data
      - ./database/seeds/dev:/docker-entrypoint-initdb.d
    networks:
      - app_network
  app:
    container_name: go_app
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: always
    depends_on:
      - postgres
    env_file:
      - .env
    ports:

      - "8000:8000"
    networks:
      - app_network
volumes:
  postgres_data: