name: crud-api-go

version: "3.9"


networks:
  app_network:

services:
  db:
    container_name: db
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres  
    ports:
      - "5432:5433"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  app:
    container_name: go_app
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - app_network

volumes:
  pgdata: {}
